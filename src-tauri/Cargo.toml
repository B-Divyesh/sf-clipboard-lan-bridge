[package]
name = "clipboard-lan-bridge"
version = "0.1.8"
description = "Deliberate encrypted text handoffs over a local network"
authors = ["Sociobot"]
license = "MIT"
edition = "2021"

[lib]
name = "clipboard_lan_bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clipboard-lan-bridge"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# Keep the GTK/WebKit-backed desktop shell out of core protocol checks. The
# release build enables this feature by default; CI can therefore exercise the
# LAN protocol on a clean Rust worker without needing a display toolchain.
desktop = ["dep:tauri", "dep:tauri-build"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
aes-gcm = "0.10"
axum = "0.8"
local-ip-address = "0.6"
p256 = { version = "0.13", features = ["ecdh"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
